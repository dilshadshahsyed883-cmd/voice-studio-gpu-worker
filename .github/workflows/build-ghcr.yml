name: Build GPU worker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - build/canary-worker-v1
    paths:
      - Dockerfile
      - app/**
      - requirements-*.txt
      - .github/workflows/build-ghcr.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/voice-studio-gpu-worker" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:canary
            ${{ env.IMAGE }}:canary-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
