name: Build IndicF5-only GPU worker image

on:
  workflow_dispatch:
  push:
    branches:
      - build/indicf5-only-v1
    paths:
      - Dockerfile
      - app/**
      - requirements-*.txt
      - .github/workflows/build-ghcr.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/voice-studio-indicf5-runtime" >> "$GITHUB_ENV"

      - name: Verify gated IndicF5 build access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Repository secret HF_TOKEN is required. Accept access to ai4bharat/IndicF5 on Hugging Face, create a read token, then save it as GitHub Actions secret HF_TOKEN."
            exit 1
          fi
          echo "HF_TOKEN is configured for build-only model bundling."

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push IndicF5-only image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:indicf5-only
            ${{ env.IMAGE }}:indicf5-only-${{ github.sha }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
